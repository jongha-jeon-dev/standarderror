name: Build and deploy site

on:
  # Every push to main, with no `paths:` filter. There used to be one --
  # `['site/**', '.github/workflows/pages.yml']` -- and it skipped the build on
  # the one push that mattered: the first real push of the history, which was a
  # force-push over an unrelated lineage. GitHub cannot compute changed paths
  # across a rewritten history, so the filter matched nothing and the site never
  # deployed. A Hugo build is seconds; the filter was saving nothing and cost
  # exactly the run it existed to schedule.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # PaperMod is a submodule under site/themes
          fetch-depth: 0             # Hugo needs history for .Lastmod
      - uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, like the theme. `latest` is what broke this build: PaperMod
          # is pinned at v8.0 and Hugo has had breaking template changes since,
          # so floating the toolchain meant the site could stop building with no
          # change to the repository -- which is what happened. 0.123.7 extended
          # is the version this site is verified to build under (80 pages, no
          # errors). Bumping it means testing the build locally first, which is
          # the point of a pin.
          hugo-version: '0.123.7'
          extended: true
      - name: Build
        working-directory: site
        run: hugo --minify --gc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `deploy-pages` waits for a deployment that Pages must be configured to
    # accept. Run #1 waited six hours and stopped only at the job limit, because
    # Settings -> Pages had no source set. Ten minutes is long enough for a real
    # deploy and short enough to read as the misconfiguration it is.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
