[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standarderror"
version = "0.1.0"
description = "The Standard Error — writes a phenomenon down as numbers or equations, then looks for the mistake everybody makes in it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jongha Jeon" }]
keywords = ["specification-testing", "time-series", "uncertainty-quantification",
            "official-statistics", "machine-learning", "reproducibility"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5"]
extras = ["yfinance", "shap", "statsmodels", "xgboost", "openpyxl"]
# `standarderror.models.scaffold` is the only module that needs torch, and torch
# is a ~800 MB install, so it is an opt-in extra rather than a dependency. The
# tests that use it skip without it; `pip install -e ".[dev,nn]"` runs them.
nn = ["torch>=2.0"]

[project.scripts]
standarderror = "standarderror.cli:main"
# A short alias, because the long name is fine in an import and tiresome at a prompt.
se = "standarderror.cli:main"

[tool.setuptools.packages.find]
include = ["standarderror*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live public API; skipped unless SERR_NETWORK_TESTS=1"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length: the tables and long docstrings are deliberate
    "B008",   # function call in default arg: dataclass field(default_factory=...)
    "B905",   # zip(strict=): every zip here pairs lists built to the same length
    "E702",   # compound statements: `ax.set_xlabel(x); ax.set_ylabel(y)` reads better
]
