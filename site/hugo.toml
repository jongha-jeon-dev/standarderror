baseURL = "https://jongha-jeon-dev.github.io/standarderror/"
languageCode = "en-gb"
title = "The Standard Error"
theme = "PaperMod"

# Every post is a page bundle (index.md plus its images), so figures live beside
# the text they belong to and never break when a slug changes.
[params]
  description = "A standard error is the width of an interval. The standard error is the mistake everybody makes. Both, with the data and the code."
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  mathjax = true

[params.author]
  name = "Jongha Jeon"

[markup.goldmark.renderer]
  unsafe = true          # required for raw HTML in figures

[markup.highlight]
  noClasses = false
  lineNos = false

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Lectures"
  url = "/lectures/"
  weight = 2
[[menu.main]]
  name = "Code"
  url = "https://github.com/jongha-jeon-dev/standarderror"
  weight = 3
