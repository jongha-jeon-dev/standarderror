baseURL = "https://YOURNAME.github.io/quantpost/"
languageCode = "en-gb"
title = "Notes on financial machine learning"
theme = "PaperMod"

# Every post is a page bundle (index.md plus its images), so figures live beside
# the text they belong to and never break when a slug changes.
[params]
  description = "Reservoir computing, risk models, and explainability — with the data and the code."
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  mathjax = true

[params.author]
  name = "Jongha Jeon"

[markup.goldmark.renderer]
  unsafe = true          # required for raw HTML in figures

[markup.highlight]
  noClasses = false
  lineNos = false

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Code"
  url = "https://github.com/YOURNAME/quantpost"
  weight = 2
